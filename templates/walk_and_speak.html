<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk and Speak — EmmaGetsHired</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Source+Serif+4:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-theme="{{ theme }}"{% if theme == 'custom' and custom_bg %} style="--parchment:{{ custom_bg }};"{% endif %}>
<div class="wrap">
  {% include '_nav.html' %}

  <div class="modal-standalone">
    <div class="m-eyebrow">Walk and Speak</div>
    <h3>🚶🗣️ Say it out loud</h3>
    <div class="q">{{ prompt.q }}</div>
    <details class="sample-details">
      <summary>Show sample answer</summary>
      <div class="sample">{{ prompt.a }}</div>
    </details>
    <div class="modal-actions">
      <form method="POST" action="{{ url_for('walk_and_speak_done') }}">
        <button class="btn-primary btn-large" type="submit">✅ I practiced this</button>
      </form>
      <a class="btn-secondary btn-large" href="{{ url_for('walk_and_speak') }}">🔄 New prompt</a>
      <a class="btn-ghost" href="{{ url_for('career_tools') }}">back to Career Tools</a>
    </div>
  </div>
</div>
</body>
</html>
