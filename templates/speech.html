<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech Practice — onemoretime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Source+Serif+4:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-theme="{{ theme }}"{% if theme == 'custom' and custom_bg %} style="--parchment:{{ custom_bg }};"{% endif %}>
<div class="wrap">
  <div class="modal-standalone">
    <div class="m-eyebrow">{{ category }}</div>
    <h3>🗣️ Speech Practice</h3>
    <div class="q">{{ question.q }}</div>
    <details class="sample-details">
      <summary>Show sample answer</summary>
      <div class="sample">{{ question.a }}</div>
    </details>
    <div class="modal-actions">
      <form method="POST" action="{{ url_for('speech_done') }}">
        <button class="btn-primary" type="submit">✅ I answered out loud</button>
      </form>
      <a class="btn-secondary" href="{{ url_for('speech') }}">🔄 different question</a>
      <a class="btn-ghost" href="{{ url_for('tracker') }}">back without logging</a>
    </div>
  </div>
</div>
</body>
</html>
